<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Delegation Playground</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at top, #1e1e38, #0e0e1a);
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: rgba(30, 30, 50, 0.45);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #a78bfa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 2rem;
            line-height: 1.5;
        }
        .input-group {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }
        input {
            flex: 1;
            background: rgba(15, 15, 25, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 0.8rem 1.2rem;
            border-radius: 12px;
            font-family: inherit;
            outline: none;
            transition: all 0.3s;
        }
        input:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.2);
        }
        button {
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            color: #fff;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            opacity: 0.95;
        }
        button:active {
            transform: translateY(0);
        }
        /* The target list containing list items and action buttons */
        #task-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        .task-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 0.8rem 1.2rem;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.3s;
        }
        .task-item:hover {
            background: rgba(255, 255, 255, 0.06);
        }
        .btn-delete {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 500;
            border: 1px solid rgba(239, 68, 68, 0.2);
            transition: all 0.2s;
        }
        .btn-delete:hover {
            background: #ef4444;
            color: #fff;
        }
        .empty-state {
            text-align: center;
            color: #64748b;
            padding: 1.5rem;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Event Delegation</h1>
        <p>Instead of attaching separate event handlers to each task delete button, attach a SINGLE event listener on the parent <code>#task-list</code> to handle dynamically added elements.</p>
        
        <div class="input-group">
            <input type="text" id="task-input" placeholder="Enter a new task...">
            <button id="btn-add">Add Task</button>
        </div>

        <ul id="task-list">
            <li class="task-item">
                <span>Learn JavaScript Closures</span>
                <button class="btn-delete">Delete</button>
            </li>
            <li class="task-item">
                <span>Master DOM Event Bubbling</span>
                <button class="btn-delete">Delete</button>
            </li>
        </ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
