<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bubbling vs Capturing</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <h1 class="main-title">Event Propagation in JavaScript</h1>

    <div class="container">
        <!-- Bubbling Section (Left) -->
        <div class="section">
            <h2>Bubbling (Bottom to Top ⬆️)</h2>
            <div class="box grandparent bubbling" id="gp-bubble">
                Grandparent
                <div class="box parent bubbling" id="p-bubble">
                    Parent
                    <div class="box child bubbling" id="c-bubble">
                        Child
                    </div>
                </div>
            </div>
        </div>

        <!-- Capturing Section (Right) -->
        <div class="section">
            <h2>Capturing (Top to Bottom ⬇️)</h2>
            <div class="box grandparent capturing" id="gp-capture">
                Grandparent
                <div class="box parent capturing" id="p-capture">
                    Parent
                    <div class="box child capturing" id="c-capture">
                        Child
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
