<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Model Overlay</title>
    <link rel="stylesheet" href="./index.css">
</head>

<body>

    <div id="container">
        <button id="open-modal-btn">OPEN MODEL</button>

        
        <!-- Overlay: pehle hidden (CSS se). Click-outside isi pe detect hoga -->
        <div id="modal-overlay" class="overlay hidden">

            <!-- Overlay: pehle hidden (CSS se). Click-outside isi pe detect hoga -->
            <div id="modal-box">
                <button id="close-modal-btn" type="button">X</button>
                <h2>Model Title</h2>
                <p>Model Content will shown here</p>
            </div>

        </div>


    </div>

    <script src="./index.js"></script>
</body>

</html>
